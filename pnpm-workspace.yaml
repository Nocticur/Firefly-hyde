packages:
  - '.'
# Only the explicitly listed native tools may run installation scripts.
minimumReleaseAge: 1440
allowBuilds:
  esbuild: true
  workerd: true
overrides:
  # Plugin 4 preserves Plugin 3's runtime/type API while dropping its bundled
  # microbundle/terser toolchain. Both consumers run with Swup 4.
  '@swup/parallel-plugin>@swup/plugin': 4.0.0
  '@swup/route-name-plugin>@swup/plugin': 4.0.0
  # Keep security fixes within each transitive dependency's existing major.
  'fast-uri@>=3.0.0 <3.1.8': 3.1.8
  'sharp@>=0.35.0 <0.35.5': 0.35.5
  'js-yaml@>=3.0.0 <3.15.2': 3.15.2
  'svgo@>=4.0.0 <4.1.0': 4.1.0
  'undici@>=7.0.0 <7.29.1': 7.29.1
  'undici@>=8.0.0 <8.10.2': 8.10.2
  'brace-expansion@>=1.0.0 <1.1.21': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'devalue@>=5.0.0 <5.9.3': 5.9.3
  'http-cache-semantics@>=4.0.0 <4.3.0': 4.3.0
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  # Argparse 2 retains legacy method aliases and drops sprintf-js entirely.
  'js-yaml@3>argparse': 2.0.1
  'smol-toml@>=1.0.0 <1.8.1': 1.9.1
  'postcss-selector-parser@>=6.0.0 <7.1.6': 7.1.6
  'katex@>=0.16.0 <0.18.7': 0.18.7
