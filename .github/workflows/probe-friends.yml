name: Probe Friend Latency

# 定时探测友链延迟并提交快照；push 到 master 后由 EdgeOne Pages 自动拉取构建
on:
  schedule:
    # UTC 00:17 / 12:17 = 北京时间 08:17 / 20:17（与 scripts/probe-friends.ts 的 slot 逻辑对应）
    - cron: '17 0 * * *'
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: write # 提交快照需要写权限

concurrency:
  group: "probe-friends"
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Probe friend link latency
        run: pnpm probe-friends

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/data/friends-latency-snapshot.json; then
            echo "Snapshot unchanged, skip commit"
          else
            git add src/data/friends-latency-snapshot.json
            git commit -m "chore: refresh friend latency snapshot"
            git push
          fi
